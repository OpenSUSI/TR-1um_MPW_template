name: Setup KLayout
description: Install pinned KLayout (cached .deb) and optionally the matching Python package

inputs:
  klayout_version:
    description: KLayout version to install
    required: false
    default: "0.30.9"
  install_python:
    description: Also install the klayout Python package (needed only by pre_check.py)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore KLayout .deb cache
      id: deb-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/klayout-deb
        key: klayout-deb-${{ inputs.klayout_version }}-${{ runner.os }}-ubuntu-24.04

    - name: Download KLayout .deb
      if: steps.deb-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.klayout_version }}"
        DEB="klayout_${VERSION}-1_amd64.deb"
        URL="https://www.klayout.org/downloads/Ubuntu-24/${DEB}"
        mkdir -p ~/.cache/klayout-deb
        wget -q "${URL}" -O ~/.cache/klayout-deb/"${DEB}"

    - name: Install KLayout .deb
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.klayout_version }}"
        DEB="$HOME/.cache/klayout-deb/klayout_${VERSION}-1_amd64.deb"
        # Try without refreshing the apt index first (fast path);
        # fall back to apt-get update only if dependencies cannot be resolved.
        if ! sudo apt-get install -y --no-install-recommends "${DEB}"; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${DEB}"
        fi

    - name: Install Python klayout package
      if: inputs.install_python == 'true'
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.klayout_version }}"
        python3 -m pip install "klayout==${VERSION}"

    - name: Show versions
      shell: bash
      run: |
        set -euo pipefail
        echo "System klayout:"
        klayout -v
        if [ "${{ inputs.install_python }}" = "true" ]; then
          echo "Python klayout:"
          python3 -c "import klayout.db; print('python-klayout OK')"
        fi
